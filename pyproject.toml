[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RL4CC"
version = "26.9.18"
description = "Reinforcement Learning for the Computing Continuum"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "***" }
]
dependencies = []

[project.optional-dependencies]
ray220 = [
  "numpy==1.25.0",
  "opencv-python==4.9.0.80",
  "protobuf==7.36.1",
  "pyarrow==12.0.1",
  "ray[rllib]==2.20.0",
  "scipy==1.14.1",
  "torch==2.14.0"
]
morl = [
  "numpy==1.25.0",
  "gymnasium==1.3.0",
  "mo-gymnasium==1.3.2",
  "morl-baselines==1.3.0",
  "scipy==1.14.1",
  "torch==2.14.0"
]

[tool.setuptools.packages.find]
where = ["."]
